<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weihnachtskarte</title>
<meta name="description" content="Animierte Klappkarte im Umschlag: Frohe Weihnachten und viel Solidarität aus dem Bundestag / Merry Christmas from the German Bundestag">
<style>
  :root {
    --bg: #1d1a18;
    --bg-2: #2a2522;
    --paper: #fffdf9;
    --env: #efe8d9;
    --env-dark: #e2d9c6;
    --env-darker: #d3c9b3;
    --hint: #cfc6b0;
    --red: #e5402a;
    --ratio: 1748 / 1240;
    --card-w: 520px;   /* Rückfallwert für sehr alte Browser ohne min() */
    --card-w: min(44vw, calc(52vh * 1748 / 1240), 820px);
    --ch: calc(var(--card-w) * 1240 / 1748);   /* Kartenhöhe */
    --env-w: calc(var(--card-w) * 1.1);
    --env-h: calc(var(--card-w) / (1748 / 1240) * 1.12);
    --ease: cubic-bezier(.65,.05,.25,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { overflow-x: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 35%, var(--bg-2) 0%, var(--bg) 70%);
    color: var(--hint);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-rows: 1fr auto;
    align-items: center; justify-items: center;
    min-height: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Bühne ---------- */
  .stage {
    perspective: 2600px;
    perspective-origin: 50% 50%;
    width: 100%;
    height: 100%;
    min-height: calc(var(--env-h) * 1.25 + 32px);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }

  /* ---------- Umschlag (drei Ebenen: Rückseite unter, Vorderseite + Lasche über der Karte) ---------- */
  .env {
    position: absolute;
    left: 50%; top: 50%;
    width: var(--env-w);
    height: var(--env-h);
    transform: translate(-50%, calc(-50% + var(--ch) * .08));
    transition: transform 1.1s var(--ease), opacity .8s ease;
    pointer-events: none;
  }
  .env.rising { transform: translate(-50%, calc(-50% + var(--ch) * .56)); }
  .env.away   { transform: translate(-50%, calc(-50% + var(--ch) * 1.4)); opacity: 0; }
  .env-back  { z-index: 1; }
  .env-front { z-index: 3; }
  .env-flap  { z-index: 4; transition: transform 1s var(--ease), opacity .8s ease, z-index 0s .45s; perspective: 1800px; }
  .env-back .sheet {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    background: var(--env-dark);
    border-radius: 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.35);
  }
  .env-front .sheet {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    border-radius: 6px; overflow: hidden;
  }
  .env-front .sheet::before {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    background: linear-gradient(135deg, var(--env) 0%, var(--env-dark) 100%);
    -webkit-clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
    clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
  }
  .env-front .sheet::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    background: linear-gradient(180deg, var(--env-darker) 0%, var(--env) 100%);
    -webkit-clip-path: polygon(0 100%, 50% 42%, 100% 100%);
    clip-path: polygon(0 100%, 50% 42%, 100% 100%);
  }
  .flap {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    transform-origin: 50% 0;
    transform: rotateX(0deg);
    transition: transform .9s var(--ease);
    -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
  }
  .flap .side {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    -webkit-clip-path: polygon(0 0, 100% 0, 50% 62%);
    clip-path: polygon(0 0, 100% 0, 50% 62%);
  }
  .flap .side.outer { background: linear-gradient(180deg, #f6f1e6 0%, var(--env) 70%, var(--env-dark) 100%); }
  .flap .side.inner { transform: rotateX(180deg); background: linear-gradient(0deg, var(--env-darker) 0%, var(--env-dark) 100%); }
  .seal {
    position: absolute; left: 50%; top: 52%;
    width: calc(var(--env-w) * .11); height: calc(var(--env-w) * .11);
    transform: translate(-50%, -50%) translateZ(1px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff6a52, var(--red) 55%, #b8301d 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,.3), inset 0 0 0 3px rgba(255,255,255,.12);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.9);
    font-size: calc(var(--env-w) * .045);
    font-weight: 700;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .opening .flap { transform: rotateX(180deg); }
  .env-flap.opening { z-index: 0; }
  .stage { cursor: pointer; }
  body.opened .stage { cursor: default; }

  /* ---------- Karte: Hülle für die Herausnahme-Animation ---------- */
  .card-wrap {
    position: relative;
    z-index: 2;
    width: var(--card-w);
    height: var(--ch);
    perspective: 2600px;          /* 3D direkt an der Karte, damit der Deckel überall echt klappt */
    -webkit-perspective: 2600px;
    /* steckt im Umschlag: etwas tiefer, leicht kleiner */
    transform: translateY(8%) scale(.8);
    transition: transform 1.1s var(--ease);
  }
  .card-wrap.rising { transform: translateY(-46%) scale(.8); }
  .card-wrap.placed { transform: translateY(0) scale(1); transition-duration: .9s; }

  /* ---------- Karte: Innenseite fest, Deckel klappt links auf ---------- */
  .card {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
    transform: translateX(0);
    transition: transform 1.6s var(--ease);
    cursor: default;
    -webkit-user-select: none; user-select: none;
  }
  .card.ready { cursor: pointer; }
  .card.open { transform: translateX(calc(var(--card-w) / 2)); }

  .inside, .cover {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    border-radius: 6px;
    overflow: hidden;
    background: var(--paper);
  }
  .inside { box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.35); }
  .inside img, .inside video {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .inside .signed { opacity: 0; transition: opacity .9s ease; }
  .inside video { opacity: 0; transition: opacity .5s ease; }
  .card.playing .inside video { opacity: 1; }
  .card.done .inside .signed { opacity: 1; }
  /* Video bleibt sichtbar, das scharfe Standbild blendet darüber ein – kein Flackern */
  .inside::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,.08) 40%, rgba(0,0,0,0));
    opacity: 1; transition: opacity 1.6s ease; pointer-events: none;
  }
  .card.open .inside::after { opacity: 0; }
  .card.open .inside::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px;
    background: linear-gradient(90deg, rgba(0,0,0,.22), rgba(0,0,0,0));
    z-index: 2; pointer-events: none;
  }

  .cover {
    transform-origin: left center;
    -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
    transform: rotateY(0deg);
    transition: transform 1.6s var(--ease);
    box-shadow: 0 30px 60px rgba(0,0,0,.55);
    background: transparent; overflow: visible;
  }
  .card.open .cover { transform: rotateY(-180deg); }
  .face {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 6px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--paper);
  }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .face.front::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    background: linear-gradient(105deg, rgba(255,255,255,0) 55%, rgba(255,255,255,.18) 75%, rgba(255,255,255,0) 90%);
    pointer-events: none;
  }
  .face.back {
    transform: rotateY(180deg);
    background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 85%, rgba(0,0,0,.18) 100%), var(--paper);
  }
  .face.back img { opacity: .08; }

  /* ---------- Bedienleiste ---------- */
  .controls {
    position: relative; z-index: 6;
    padding: 0 16px 28px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    min-height: 96px;
  }
  .msg {
    font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    opacity: .8; max-width: 92ch; line-height: 1.6;
    margin-bottom: 14px;
  }
  .msg .dot { color: var(--red); }
  .msg .en-line { opacity: .75; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btnrow[hidden] { display: none; }
  .btn {
    -webkit-appearance: none; appearance: none; border: 0; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: #fff; background: var(--red);
    padding: 12px 26px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(229,64,42,.35);
    transition: transform .15s ease, box-shadow .15s ease, opacity .4s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(229,64,42,.45); }
  .btn:active { transform: translateY(0); }
  .btn[hidden] { display: none; }
  .msg .ico { width: 18px; height: 18px; fill: var(--hint); vertical-align: -4px; margin-right: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .card, .cover, .inside::after, .card-wrap, .env, .flap { transition-duration: .01s; }
  }
  @media (max-width: 700px) {
    :root { --card-w: min(46vw, calc(50vh * 1748 / 1240)); }
    .msg { font-size: 11px; }
    .btn { font-size: 13px; padding: 11px 20px; }
  }
</style>
</head>
<body>
  <div class="stage">

    <div class="card-wrap" id="wrap">
      <div class="card" id="card" role="button" tabindex="-1" aria-label="Weihnachtskarte">
        <div class="inside">
          <img class="plain" id="imgPlain" src="inside.jpg?v=2" alt="Innenseite der Karte">
          <video id="sig" src="signature.mp4?v=2" muted playsinline preload="auto" aria-hidden="true"></video>
          <img class="signed" id="imgSigned" src="inside-signed.jpg?v=2" alt="Innenseite mit Unterschrift Ulrich Thoden">
        </div>
        <div class="cover">
          <div class="face front"><img src="cover.jpg" alt="Vorderseite der Weihnachtskarte"></div>
          <div class="face back"><img src="cover.jpg" alt=""></div>
        </div>
      </div>
    </div>

    <div class="env env-back"  aria-hidden="true"><div class="sheet"></div></div>
    <div class="env env-front" aria-hidden="true"><div class="sheet"></div></div>
    <div class="env env-flap"  aria-hidden="true">
      <div class="flap">
        <div class="side outer"></div>
        <div class="side inner"></div>
        <div class="seal">★</div>
      </div>
    </div>

  </div>

  <div class="controls">
    <div class="msg" id="msg">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      <span lang="de">Bitte erst den Ton einschalten, dann den Umschlag öffnen.</span><br>
      <span lang="en" class="en-line">Please turn on your sound first, then open the envelope.</span>
    </div>
    <div class="btnrow" id="btnRow">
      <button class="btn" id="btnEnvelope" type="button" lang="de">Umschlag öffnen</button>
      <button class="btn" id="btnEnvelopeEn" type="button" lang="en">Open envelope</button>
    </div>
    <button class="btn" id="btnCard" type="button" hidden>Karte öffnen</button>
  </div>

  <audio id="auAutoplay" src="autoplay.mp3" preload="auto"></audio>
  <audio id="auOeffnen"  src="oeffnen.mp3?v=2"  preload="auto" loop></audio>

<script>
(() => {
  const wrap     = document.getElementById('wrap');
  const card     = document.getElementById('card');
  const envs = Array.from(document.querySelectorAll('.env'));
  const video    = document.getElementById('sig');
  const msg      = document.getElementById('msg');
  const btnEnv   = document.getElementById('btnEnvelope');
  const btnCard  = document.getElementById('btnCard');
  const auAuto   = document.getElementById('auAutoplay');
  const auOeffnen= document.getElementById('auOeffnen');

  const OPEN_MS      = 1600;   // Dauer Deckel-Animation (CSS)
  const START_DELAY  = 350;    // Pause vor Beginn der Unterschrift
  const AUTO_OPEN_MS = 9500;   // Karte öffnet sich automatisch nach 9,5 s (ab Start von autoplay)

  let phase = 'envelope';      // envelope → card-closed → card-open
  let sigTimer = null, autoTimer = null, safetyTimer = null;
  let openedByUser = false;

  const setMsg = (html) => { msg.innerHTML = html; };

  /* ---------- Sprachen: Texte und Medien ---------- */
  const LANG = {
    de: {
      hint: 'Karte antippen oder Button nutzen', greeting: 'Frohe Weihnachten',
      open: 'Karte öffnen', close: 'Karte schließen',
      ariaOpen: 'Weihnachtskarte öffnen', ariaClose: 'Weihnachtskarte schließen',
      plain: 'inside.jpg?v=2', video: 'signature.mp4?v=2', signed: 'inside-signed.jpg?v=2',
      altPlain: 'Innenseite der Karte', altSigned: 'Innenseite mit Unterschrift Ulrich Thoden'
    },
    en: {
      hint: 'Tap the card or use the button', greeting: 'Merry Christmas',
      open: 'Open card', close: 'Close card',
      ariaOpen: 'Open Christmas card', ariaClose: 'Close Christmas card',
      plain: 'inside-en.jpg?v=2', video: 'signature-en.mp4?v=2', signed: 'inside-signed-en.jpg?v=2',
      altPlain: 'Inside of the card', altSigned: 'Inside of the card, signed by Ulrich Thoden'
    }
  };
  let T = LANG.de;
  function applyLanguage(lng) {
    T = LANG[lng] || LANG.de;
    document.documentElement.lang = lng;
    btnCard.textContent = T.open;
    if (lng !== 'de') {
      const imgPlain = document.getElementById('imgPlain');
      const imgSigned = document.getElementById('imgSigned');
      imgPlain.src = T.plain;  imgPlain.alt = T.altPlain;
      imgSigned.src = T.signed; imgSigned.alt = T.altSigned;
      video.src = T.video;
      try { video.load(); } catch (e) {}
    }
  }

  /* ---------- Audio ---------- */
  // Audio darf die Karte nie blockieren: jeder Fehler wird abgefangen
  function rewind(a) { try { a.currentTime = 0; } catch (e) {} }
  function safePause(a) { try { a.pause(); } catch (e) {} }
  function safePlay(a) {
    try {
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  // Karte offen: öffnen.mp3 in Dauerschleife
  function switchToLoop() {
    safePause(auAuto);
    rewind(auOeffnen);
    safePlay(auOeffnen);
  }
  // Karte wieder geschlossen: ursprünglicher Sound (autoplay.mp3) in Dauerschleife
  function switchToClosedLoop() {
    safePause(auOeffnen);
    auAuto.loop = true;
    rewind(auAuto);
    safePlay(auAuto);
  }
  // Öffnet sich die Karte automatisch, läuft autoplay weiter; danach die Dauerschleife
  auAuto.addEventListener('ended', () => {
    if (phase === 'card-open' && !openedByUser) switchToLoop();
  });

  /* ---------- Umschlag öffnen ---------- */
  function openEnvelope(lng) {
    if (phase !== 'envelope') return;
    phase = 'card-closed';
    applyLanguage(lng === 'en' ? 'en' : 'de');
    document.getElementById('btnRow').hidden = true;
    setMsg('&nbsp;');
    document.body.classList.add('opened');

    // Ab hier läuft die 9,5-s-Uhr; Ton startet sofort (Nutzergeste)
    autoTimer = setTimeout(() => openCard(false), AUTO_OPEN_MS);
    rewind(auAuto);
    safePlay(auAuto);

    envs.forEach(e => e.classList.add('opening'));           // Lasche auf
    setTimeout(() => { wrap.classList.add('rising'); envs.forEach(e => e.classList.add('rising')); }, 600); // Karte gleitet heraus, Umschlag sinkt
    setTimeout(() => {                                       // Umschlag weg, Karte an ihren Platz
      envs.forEach(e => e.classList.add('away'));
      wrap.classList.remove('rising');
      wrap.classList.add('placed');
    }, 1650);
    setTimeout(() => {
      card.classList.add('ready');
      card.setAttribute('tabindex', '0');
      btnCard.hidden = false;
      setMsg('<span class="dot">●</span>&nbsp; ' + T.hint);
    }, 2000);
  }

  /* ---------- Karte ---------- */
  function resetInside() {
    clearTimeout(sigTimer);
    clearTimeout(safetyTimer);
    card.classList.remove('playing', 'done');
    try { video.pause(); video.currentTime = 0; } catch (e) {}
  }
  function playSignature() {
    card.classList.add('playing');
    try {
      const p = video.play();
      if (p && p.catch) p.catch(() => card.classList.add('done'));
    } catch (e) { card.classList.add('done'); }
    // Sicherheitsnetz: falls das Video hängt, nach 7 s das Standbild mit Unterschrift zeigen
    safetyTimer = setTimeout(() => { if (phase === 'card-open') card.classList.add('done'); }, 7000);
  }
  video.addEventListener('ended', () => card.classList.add('done'));
  video.addEventListener('error', () => card.classList.add('done'));

  function openCard(byUser) {
    if (phase !== 'card-closed') return;
    phase = 'card-open';
    clearTimeout(autoTimer);
    openedByUser = !!byUser;

    resetInside();
    card.classList.add('open');
    if (byUser) switchToLoop();            // sofortiger Wechsel auf öffnen.wav in Dauerschleife
    card.setAttribute('aria-label', T.ariaClose);
    btnCard.textContent = T.close;
    setMsg('<span class="dot">●</span>&nbsp; ' + T.greeting);
    sigTimer = setTimeout(playSignature, OPEN_MS + START_DELAY);
  }

  function closeCard() {
    if (phase !== 'card-open') return;
    phase = 'card-closed';
    card.classList.remove('open');
    card.setAttribute('aria-label', T.ariaOpen);
    btnCard.textContent = T.open;
    setMsg('<span class="dot">●</span>&nbsp; ' + T.hint);
    sigTimer = setTimeout(resetInside, OPEN_MS);
    switchToClosedLoop();
    // Nach dem ersten Öffnen kein Auto-Öffnen mehr
  }

  function toggleCard() { phase === 'card-open' ? closeCard() : openCard(true); }

  btnEnv.addEventListener('click', () => openEnvelope('de'));
  document.getElementById('btnEnvelopeEn').addEventListener('click', () => openEnvelope('en'));
  // Klick direkt auf den Umschlag: Deutsch als Standard
  document.querySelector('.stage').addEventListener('click', () => { if (phase === 'envelope') openEnvelope('de'); });
  btnCard.addEventListener('click', toggleCard);
  card.addEventListener('click', () => { if (card.classList.contains('ready')) toggleCard(); });
  card.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && card.classList.contains('ready')) { e.preventDefault(); toggleCard(); }
  });
})();
</script>
</body>
</html>
